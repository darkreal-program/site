<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Меню — Рюмочная на Патриарших</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="menu-body">
  <header class="page-header">
    <a class="call-btn dark" href="index.html" aria-label="На главную">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
      <span>На главную</span>
    </a>

    <a class="page-header-title" href="index.html">Рюмочная на Патриарших</a>

    <a class="call-btn dark" href="tel:+79776101289" aria-label="Позвонить: +7 977 610 12 89">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>
      </svg>
      <span>Позвонить</span>
    </a>
  </header>

  <main class="menu-page">
    <h1 class="menu-heading">Меню</h1>
    <nav class="menu-tabs" id="menuTabs"></nav>

    <!-- Выбранное блюдо -->
    <div class="dish" id="dish">
      <!-- На телефоне здесь карусель: по бокам соседние блюда в тумане -->
      <div class="dish-stage" id="dishStage">
        <div class="dish-img" id="dishImg"></div>
      </div>
      <h2 class="dish-name" id="dishName"></h2>
      <p class="dish-desc" id="dishDesc"></p>
      <p class="dish-price" id="dishPrice"></p>
    </div>

    <!-- Лента блюд: по краям уходят в туман -->
    <div class="flow">
      <button class="flow-arrow flow-prev" id="flowPrev" type="button" aria-label="Предыдущее блюдо">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg>
      </button>
      <div class="flow-track" id="flowTrack"></div>
      <button class="flow-arrow flow-next" id="flowNext" type="button" aria-label="Следующее блюдо">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg>
      </button>
    </div>
  </main>

  <script src="menu-data.js"></script>
  <script src="menu.js"></script>
</body>
</html>
